<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{rootClass}}">
  <sc-if value="{{standalone}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="height: 720px; background: var(--bg);"></div>
  </sc-if>
  <div class="ast">
    <sc-if value="{{showHint}}" hint-placeholder-val="{{true}}">
      <div class="ast-hint" role="status">
        <button type="button" class="ast-hint-body" onClick="{{openChat}}"><strong>Oi! Eu sou o {{name}},</strong> assistente 24h da Master. Tire suas dúvidas por aqui.</button>
        <button type="button" class="ast-hint-x" onClick="{{dismissHint}}" aria-label="Fechar aviso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
    </sc-if>

    <button type="button" class="ast-launch {{launchClass}}" onClick="{{toggle}}" aria-label="{{launchLabel}}" aria-expanded="{{expanded}}">
      <img src="assets/23b264a5c528356376b7cfac5e66d4f4.png" alt="">
      <span class="ast-dot" aria-hidden="true"></span>
    </button>

    <section class="ast-panel {{panelClass}}" role="dialog" aria-label="Assistente virtual da Master" aria-hidden="{{hidden}}">
      <header class="ast-head">
        <span class="ast-head-av"><img src="assets/23b264a5c528356376b7cfac5e66d4f4.png" alt=""><span class="ast-dot" aria-hidden="true"></span></span>
        <span class="ast-head-t">
          <strong>{{name}} <span class="ast-status"><span class="ast-online" aria-hidden="true"></span>Online</span></strong>
          <span>Assistente 24h da Master</span>
        </span>
        <button type="button" class="ast-close" onClick="{{closeChat}}" aria-label="Fechar conversa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </header>

      <div class="ast-msgs" ref="{{setList}}" aria-live="polite">
        <sc-for list="{{messages}}" as="m" hint-placeholder-count="2">
          <sc-if value="{{m.isBot}}" hint-placeholder-val="{{true}}">
            <div class="ast-row bot">
              <img class="ast-av" src="assets/23b264a5c528356376b7cfac5e66d4f4.png" alt="">
              <div class="ast-bub">
                <span class="ast-txt">{{m.text}}</span>
                <sc-if value="{{m.hasLinks}}" hint-placeholder-val="{{false}}">
                  <span class="ast-links">
                    <sc-for list="{{m.links}}" as="l">
                      <a class="ast-link {{l.cls}}" href="{{l.href}}" target="{{l.target}}" rel="noopener">{{l.label}}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
                    </sc-for>
                  </span>
                </sc-if>
              </div>
            </div>
            <sc-if value="{{m.hasChips}}" hint-placeholder-val="{{false}}">
              <div class="ast-chips">
                <sc-for list="{{m.chips}}" as="c">
                  <button type="button" class="ast-chip" onClick="{{c.pick}}">{{c.label}}</button>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
          <sc-if value="{{m.isMe}}" hint-placeholder-val="{{false}}">
            <div class="ast-row me"><div class="ast-bub">{{m.text}}</div></div>
          </sc-if>
        </sc-for>
        <sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
          <div class="ast-row bot">
            <img class="ast-av" src="assets/23b264a5c528356376b7cfac5e66d4f4.png" alt="">
            <div class="ast-bub ast-typing" aria-label="{{name}} está digitando"><i></i><i></i><i></i></div>
          </div>
        </sc-if>
      </div>

      <form class="ast-form" onSubmit="{{send}}">
        <input class="ast-input" type="text" value="{{draft}}" onInput="{{onInput}}" onKeyDown="{{onKey}}" placeholder="Digite sua dúvida" enterKeyHint="send" aria-label="Digite sua dúvida" autocomplete="off" maxlength="300">
        <button class="ast-send" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </form>
    </section>
  </div>
</div>
</x-dc>
